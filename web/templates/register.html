<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registreren — HesPulse</title>
<link rel="icon" href="/static/hespulse-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<form class="login-card" method="post" action="/registreer">
  <div class="login-brand">
    <img src="/static/hespulse-logo.svg" alt="HesPulse logo">
    <span>HesPulse</span>
  </div>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label>Gebruikersnaam
    <input type="text" name="username" autocomplete="username" minlength="3" maxlength="32" required>
  </label>
  <label>Wachtwoord
    <input type="password" name="password" autocomplete="new-password" minlength="8" required>
  </label>
  <label>Wachtwoord herhalen
    <input type="password" name="password_confirm" autocomplete="new-password" minlength="8" required>
  </label>
  <button type="submit">Account aanmaken</button>
  <p class="muted" style="text-align: center; margin: 0;">Al een account? <a href="/login">Inloggen</a></p>
  <p class="footer">{{ disclaimer }}</p>
</form>
</body>
</html>
