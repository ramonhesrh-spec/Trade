<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen — HesPulse</title>
<link rel="icon" href="/static/hespulse-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<form class="login-card" method="post" action="/login">
  <div class="login-brand">
    <img src="/static/hespulse-logo.svg" alt="HesPulse logo">
    <span>HesPulse</span>
  </div>
  <svg class="login-chart" viewBox="0 0 220 46" aria-hidden="true">
    <polyline points="10,36 46,28 82,32 118,18 154,22 210,8" fill="none" stroke="#0ABAB5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.5"/>
    <g stroke-width="2">
      <line x1="10" y1="28" x2="10" y2="42" stroke="#c53030"/><rect x="6" y="30" width="8" height="8" fill="#c53030"/>
      <line x1="46" y1="20" x2="46" y2="36" stroke="#2f855a"/><rect x="42" y="22" width="8" height="10" fill="#2f855a"/>
      <line x1="82" y1="24" x2="82" y2="38" stroke="#c53030"/><rect x="78" y="26" width="8" height="9" fill="#c53030"/>
      <line x1="118" y1="10" x2="118" y2="26" stroke="#2f855a"/><rect x="114" y="12" width="8" height="10" fill="#2f855a"/>
      <line x1="154" y1="14" x2="154" y2="30" stroke="#c53030"/><rect x="150" y="16" width="8" height="10" fill="#c53030"/>
      <line x1="210" y1="0" x2="210" y2="18" stroke="#2f855a"/><rect x="206" y="2" width="8" height="10" fill="#2f855a"/>
    </g>
  </svg>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label>Gebruikersnaam
    <input type="text" name="username" autocomplete="username" required>
  </label>
  <label>Wachtwoord
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button type="submit">Inloggen</button>
  <p class="muted" style="text-align: center; margin: 0;">Nog geen account? <a href="/registreer">Registreren</a></p>
  <p class="footer">{{ disclaimer }}</p>
</form>
</body>
</html>
