<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e0f">
<title>{% block title %}HesPulse{% endblock %}</title>
<link rel="icon" href="/static/hespulse-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-top">
    <a href="/dashboard" class="brand">
      <img src="/static/hespulse-logo.svg" alt="HesPulse logo">
      <span>HesPulse</span>
    </a>
    <div class="topbar-right">
      <span class="live-pill"><span class="ping"></span><span id="live-clock">--:--:--</span></span>
      <form action="/logout" method="post" class="logout-form">
        {% if user %}<span class="muted">{{ user.username }}</span>{% endif %}
        <button type="submit">Uitloggen</button>
      </form>
    </div>
  </div>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <details class="coin-menu">
      <summary>
        Coins
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6,9 12,15 18,9"/></svg>
      </summary>
      <div class="coin-menu-list">
        {% for c in coins %}
          <a href="/coins/{{ c.symbol }}">{{ c.symbol }}</a>
        {% endfor %}
      </div>
    </details>
    <a href="/uitleg">Uitleg</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="footer">{{ disclaimer }}</footer>
<script>
  // Toont dat de pagina leeft, geen decoratie: een stilstaande klok in een
  // "live" balk zou juist wantrouwen wekken.
  (function () {
    var el = document.getElementById("live-clock");
    if (!el) return;
    function tick() {
      el.textContent = new Date().toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
</body>
</html>
